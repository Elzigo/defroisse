<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F1EE">
<title>Défroisse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300..800&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap">
<style>
/* Système visuel : fond gris chaud, cartes blanches, verre dépoli posé sur des bandes de dégradé,
   données en indigo et sauge, cartes pastel bleu et rose, carte sombre olive, pilules et cases.
   Grands chiffres en graisse légère avec l'unité en petit, titres légers, serif éditoriale pour les accroches. */
:root{
  --bg:#F2F1EE; --bg-2:#E8E6E1; --card:#FFFFFF; --card-2:#F7F6F3; --card-3:#EEEDE9;
  --ink:#1F1F24; --ink-2:#55555C; --ink-3:#6B6B73; --ink-4:#CECED3; --mixk:#000; --ts:1;
  --line:rgba(31,31,36,.07); --line-2:rgba(31,31,36,.12);
  --dark:#25252D; --dark-2:#34343F;
  --indigo:#46458C; --indigo-2:#8584C8; --indigo-soft:#E6E6F5;
  --sage:#B5C98F; --sage-2:#DDE8C9;
  --seg:#E4E4E8;
  --blue-c:#DDE9F8; --pink-c:#F7E3E3; --maroon:#7C4148; --navy-b:#3E3D7C;
  --pink:#F3A0DC; --orange:#F7924B; --olive:#463B2B; --olive-2:#5A4E3C; --cream:#F5EEE2;
  --lime:#E2EFA0; --sagec:#CFE0D3;
  --accent:#46458C; --accent-soft:#E6E6F5; --accent-ink:#46458C;
  --violet:#5B5AA6; --amber:#C98320; --green:#3E9B68; --rose:#D0679A;
  --drain:#5B8BD6; --release:#D0679A; --tone:#E0884C; --posture:#5B5AA6; --tool:#789A55;
  --p-pink:#F7E3E3; --p-peach:#FBE6D6; --p-butter:#F6EDC8; --p-mint:#DDEEDF; --p-sky:#DDE9F8; --p-lilac:#E7E3F6; --p-lime:#E2EFA0; --p-sage:#CFE0D3;
  --g1:#F3A0DC; --g2:#F7924B; --g3:#F2D46B; --g4:#B5C98F; --g5:#8FB4E8; --g6:#8584C8;
  --grad:linear-gradient(90deg,var(--g6),var(--g5) 30%,var(--g4) 60%,var(--g3) 80%,var(--g2));
  --glass:rgba(255,255,255,.58); --glass-b:rgba(255,255,255,.8);
  --shadow:0 1px 2px rgba(30,30,40,.04),0 10px 28px -20px rgba(30,30,40,.25);
  --shadow-lg:0 22px 50px -22px rgba(30,30,50,.38),0 2px 6px rgba(30,30,40,.05);
  --ease:cubic-bezier(.22,1,.36,1); --drawer:cubic-bezier(.32,.72,0,1);
  --f-ui:"Manrope","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --f-serif:"Newsreader","Iowan Old Style",Georgia,serif;
  --pad:20px; --r-sm:8px; --r:14px; --r-lg:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101012; --bg-2:#17171A; --card:#1B1B1F; --card-2:#222227; --card-3:#2A2A30;
    --ink:#F2F2F4; --ink-2:#B4B4BC; --ink-3:#8E8E96; --mixk:#fff; --ink-4:#46464D;
    --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
    --dark:#F2F2F4; --dark-2:#DADADF;
    --indigo:#9A99E6; --indigo-2:#6A69B8; --indigo-soft:#262544;
    --sage:#B8CC92; --sage-2:#2E3524; --seg:#2C2C33;
    --blue-c:#1C2533; --pink-c:#2C1F21; --maroon:#E39AA2; --navy-b:#A5A4EE;
    --accent:#9A99E6; --accent-soft:#262544; --accent-ink:#B4B3F0;
    --violet:#A5A4EE; --amber:#EDB25A; --green:#6CCB94; --rose:#EE98C2;
    --drain:#86ADEB; --release:#EE98C2; --tone:#F2A874; --posture:#A5A4EE; --tool:#A3C47F;
    --p-pink:#2C1F21; --p-peach:#2E2319; --p-butter:#2D2917; --p-mint:#1B2A1F; --p-sky:#1C2533; --p-lilac:#252235; --p-lime:#2C321A; --p-sage:#1E2A22;
    --glass:rgba(34,34,40,.58); --glass-b:rgba(255,255,255,.1);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -20px rgba(0,0,0,.8);
    --shadow-lg:0 22px 50px -22px rgba(0,0,0,.85),0 2px 6px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101012; --bg-2:#17171A; --card:#1B1B1F; --card-2:#222227; --card-3:#2A2A30;
  --ink:#F2F2F4; --ink-2:#B4B4BC; --ink-3:#8E8E96; --mixk:#fff; --ink-4:#46464D;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --dark:#F2F2F4; --dark-2:#DADADF;
  --indigo:#9A99E6; --indigo-2:#6A69B8; --indigo-soft:#262544;
  --sage:#B8CC92; --sage-2:#2E3524; --seg:#2C2C33;
  --blue-c:#1C2533; --pink-c:#2C1F21; --maroon:#E39AA2; --navy-b:#A5A4EE;
  --accent:#9A99E6; --accent-soft:#262544; --accent-ink:#B4B3F0;
  --violet:#A5A4EE; --amber:#EDB25A; --green:#6CCB94; --rose:#EE98C2;
  --drain:#86ADEB; --release:#EE98C2; --tone:#F2A874; --posture:#A5A4EE; --tool:#A3C47F;
  --p-pink:#2C1F21; --p-peach:#2E2319; --p-butter:#2D2917; --p-mint:#1B2A1F; --p-sky:#1C2533; --p-lilac:#252235; --p-lime:#2C321A; --p-sage:#1E2A22;
  --glass:rgba(34,34,40,.58); --glass-b:rgba(255,255,255,.1);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -20px rgba(0,0,0,.8);
  --shadow-lg:0 22px 50px -22px rgba(0,0,0,.85),0 2px 6px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink-2);font:400 15px/1.55 var(--f-ui);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:clip}
::selection{background:var(--indigo-soft)}
a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block}
p{margin:0 0 10px;text-wrap:pretty}
b,strong{font-weight:600;color:var(--ink)}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.serif{font-family:var(--f-serif);font-weight:400;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.small{font-size:13.5px}
.muted{color:var(--ink-2)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Coquille */
.app{max-width:720px;margin:0 auto;padding:0 var(--pad) calc(112px + env(safe-area-inset-bottom))}
@media (min-width:900px){ :root{--pad:28px} .app{max-width:860px} }
.panel{padding-top:calc(env(safe-area-inset-top) + 6px);animation:fade .32s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;min-height:60px}
.brand{display:inline-flex;align-items:center;gap:10px;font:500 17px/1 var(--f-ui);letter-spacing:-.02em;color:var(--ink)}
.brand{cursor:pointer;-webkit-user-select:none;user-select:none;outline-offset:6px}
.brand{gap:6px}
.brand i{width:40px;height:37px;margin:-2px 0 0 -3px;background:url(__LOGO__) center/contain no-repeat;transform-origin:50% 70%}
.brand.wig i{animation:kwig .5s var(--ease)}
.brand .wm{display:block;width:84px;height:17px;margin-top:2px;background:url(__WORDMARK__) left center/contain no-repeat}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .brand .wm{background-image:url(__WORDMARK_W__)} }
:root[data-theme="dark"] .brand .wm{background-image:url(__WORDMARK_W__)}
@keyframes kwig{0%,100%{transform:none}22%{transform:rotate(-11deg) scale(1.06)}50%{transform:rotate(8deg)}76%{transform:rotate(-3deg)}}
.top-r{display:flex;gap:8px}
.icon-btn{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);box-shadow:var(--shadow);flex:none;transition:transform .15s var(--ease)}
.icon-btn:active{transform:scale(.93)}
.icon-btn.tint{background:var(--blue-c);border-color:transparent;color:var(--indigo);box-shadow:none}
.icon-btn .dot{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--indigo);color:#fff;font:700 10px/18px var(--f-ui);text-align:center;box-shadow:0 0 0 2px var(--bg)}
.icon-btn .dot:empty,.icon-btn .dot[data-n="0"]{display:none}
.icon-btn[aria-pressed="true"]{background:var(--dark);color:var(--card);border-color:var(--dark)}
.icon-btn[aria-pressed="true"] svg.i{fill:currentColor}
.datepick{cursor:pointer}
.datepick input{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;cursor:pointer;font-size:16px}
.datepick input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:auto;height:auto;margin:0;padding:0;cursor:pointer}
.glass{background:rgba(255,255,255,.3)!important;border:1px solid rgba(255,255,255,.5)!important;color:#fff!important;backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);box-shadow:none!important}
.title-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.title{font:400 34px/1.1 var(--f-ui);letter-spacing:-.035em;color:var(--ink);margin:10px 0 6px;text-wrap:balance}
.title .mute,.title .lt{color:var(--ink-3)}
.subtitle{margin:0 0 20px;font-size:15px;line-height:1.5;color:var(--ink-2)}
@media (min-width:700px){ .title{font-size:42px} }
.more{font:500 14px var(--f-ui);color:var(--ink-2);white-space:nowrap}
button.more{display:inline-flex;align-items:center;gap:2px;border:0;background:none;padding:0;color:var(--ink)}
.more svg.i{width:16px;height:16px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:34px 0 14px}
.sec-h h2{display:flex;align-items:center;gap:8px;font:400 21px/1.2 var(--f-ui);letter-spacing:-.025em;color:var(--ink);margin:0}
.sec-h h2 svg.i{width:18px;height:18px;color:var(--ink-3)}
.sec-h .more{font-size:13.5px;color:var(--ink-3)}
.sec-h button.more{color:var(--ink);padding:13px 0;margin:-13px 0}
.hint{font-size:13.5px;color:var(--ink-3);margin:10px 0 0}
.note{font-size:12.5px;color:var(--ink-3);margin:26px 4px 0;line-height:1.5}
.stretch{position:absolute;inset:0;z-index:1;border:0;margin:0;padding:0;background:none;border-radius:inherit;cursor:pointer}
.stretch:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}

/* Verre dépoli */
.glass-card{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);box-shadow:0 14px 34px -20px rgba(40,40,70,.35),inset 0 1px 0 rgba(255,255,255,.7)}
/* Bandes de dégradé (fond des cartes de verre) */
.bands{position:absolute;inset:-10px;z-index:-1;display:grid;grid-template-columns:1.3fr 1.2fr 1fr 1.1fr;filter:blur(7px)}
.bands i{display:block}
.bands i:nth-child(1){background:linear-gradient(180deg,#C9B8F2 0%,#9A86DC 35%,#7FA9E4 70%,#BFD2F4 100%)}
.bands i:nth-child(2){background:linear-gradient(180deg,#A596E4 0%,#3E4068 40%,#8C7DD9 75%,#C3B4F4 100%)}
.bands i:nth-child(3){background:linear-gradient(180deg,#6576BC 0%,#2F3252 45%,#7486D2 80%,#A9B8EC 100%)}
.bands i:nth-child(4){background:linear-gradient(180deg,#DDEFC2 0%,#A8C0E8 45%,#7461C8 80%,#B7A6F0 100%)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .bands{opacity:.7} }

/* Jauge de la semaine */
.metric{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:10px 0 6px}
.lgd{display:flex;gap:14px;font:500 13px/1 var(--f-ui);color:var(--ink-2)}
.lgd span{display:inline-flex;align-items:center;gap:7px}
.lgd i{width:7px;height:16px;border-radius:2px;background:repeating-linear-gradient(0deg,var(--c) 0 2.2px,transparent 2.2px 3.6px)}
.bignum{font:300 38px/1 var(--f-ui);letter-spacing:-.04em;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.bignum span{font-size:17px;font-weight:400;letter-spacing:-.01em;color:var(--ink-2)}
.gauge-w{position:relative;max-width:330px;margin:2px auto 0}
.gauge{display:block;width:100%;height:auto}
.gauge .s{fill:var(--seg);transition:fill .3s var(--ease)}
.gauge .s.d{fill:var(--indigo)}
.gauge .s.t{fill:var(--sage)}
.gauge-c{position:absolute;left:0;right:0;bottom:4px;text-align:center}
.gauge-c span{display:block;font:500 13.5px/1.2 var(--f-ui);color:var(--ink-3)}
.gauge-c b{display:block;font:300 40px/1.1 var(--f-ui);letter-spacing:-.04em;color:var(--ink);font-variant-numeric:tabular-nums}
.gauge-m{margin:8px 0 0;text-align:center;font:500 13.5px/1.3 var(--f-ui);color:var(--ink-2);font-variant-numeric:tabular-nums}
.gauge-m i{font-style:normal;color:#55702F;margin-left:12px}
.gauge-m i::before{content:"";display:inline-block;width:7px;height:7px;margin:0 6px 1px 0;border-radius:50%;background:var(--sage)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .gauge-m i{color:var(--sage)} }
.daychip{position:relative;display:inline-flex;align-items:center;gap:5px;height:44px;padding:0 11px 0 15px;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);font:500 14px/1 var(--f-ui);color:var(--ink);white-space:nowrap}
.daychip svg.i{width:16px;height:16px;color:var(--ink-3)}
.daychip.other{background:var(--dark);border-color:var(--dark);color:var(--card)}
.daychip.other svg.i{color:currentColor}

/* Plan de la semaine : barres hachurées */
.planw{position:relative;margin-top:18px;padding:16px 14px 12px;border-radius:var(--r)}
.planw-h{display:flex;justify-content:space-between;align-items:center;margin:0 4px 10px}
.planw-h b{font:500 15px var(--f-ui);color:var(--ink)}
.planw-h span{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:8px;border:1px solid var(--line-2);font:500 12px var(--f-ui);color:var(--ink-2)}
.pbars{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:end;height:168px}
.pb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;padding:6px 0 6px;border:0;border-radius:10px;background:none;cursor:pointer;transition:background .2s var(--ease)}
.pb[aria-pressed="true"]{background:var(--card-3)}
.pb-v{font:500 11px/1 var(--f-ui);color:var(--ink-2);font-variant-numeric:tabular-nums}
.pb-bar{position:relative;display:block;width:30px;border-radius:3px;overflow:hidden;background:repeating-linear-gradient(135deg,var(--indigo) 0 2.4px,transparent 2.4px 7px);box-shadow:inset 0 0 0 1.5px var(--indigo)}
.pb-bar i{position:absolute;left:0;right:0;bottom:0;background:var(--indigo)}
.pb-bar.full{background:var(--indigo)}
.pb-bar svg.i{position:absolute;left:50%;top:5px;transform:translateX(-50%);width:13px;height:13px;color:#fff;stroke-width:2.6}
.pb.future .pb-bar{opacity:.55}
.pb-d{margin-top:4px;font:500 11px/1 var(--f-ui);color:var(--ink-3)}
.pb b{font:500 13.5px/1 var(--f-ui);color:var(--ink)}
.pb.today b{color:var(--indigo);font-weight:700}

/* Programme du jour : pile de cartes de verre sur bandes */
.agenda{position:relative;isolation:isolate;overflow:hidden;border-radius:var(--r-lg);padding:22px 16px}
.gl-stack{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;max-width:440px;margin:0 auto;padding:8px;border-radius:12px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.glrow{position:relative;min-width:0;display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px 10px 10px;border:0;border-radius:10px;background:rgba(246,246,247,.9);text-align:left;color:var(--ink-2);box-shadow:0 1px 0 rgba(255,255,255,.6) inset}
.glrow .av{position:relative;flex:none;width:46px;height:46px;border-radius:8px;overflow:hidden;background:color-mix(in srgb,var(--c) 45%,#ddd)}
.glrow .av img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.glrow .tx{flex:1;min-width:0}
.glrow .l1{display:flex;align-items:baseline;gap:8px}
.glrow .l1 b{font:500 14.5px/1.25 var(--f-ui);color:#1F1F24}
.glrow .l1 span{font:400 12.5px var(--f-ui);color:#5E5E66;white-space:nowrap}
.glrow .l2{display:block;margin-top:2px;font:400 13.5px/1.35 var(--f-ui);color:#34343B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glrow .st{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff;color:#1F1F24;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.glrow .st svg.i{width:15px;height:15px}
.glrow.done .st{background:var(--sage);color:#26301A}
.glrow.done .l2{color:#6F7B5C}
.glbig{min-width:0;display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;align-items:center;min-height:196px;padding:22px 16px;border-radius:10px;background:rgba(240,240,241,.94)}
.mini{width:min(100%,260px);padding:10px 12px 12px;border-radius:10px;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.55),0 10px 24px -14px rgba(0,0,0,.35)}
.mini-h{display:flex;justify-content:space-between;font:500 11.5px/1 var(--f-ui);color:#6B6B72;margin-bottom:10px}
.mini-b{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;background:#F4F4F5}
.mini-b .ic{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:8px;background:var(--c);color:#fff}
.mini-b .ic svg.i{width:16px;height:16px}
.mini-b b{flex:1;min-width:0;font:600 14px/1.2 var(--f-ui);color:#1F1F24;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-b .mm{font:500 12px var(--f-ui);color:#6B6B72;white-space:nowrap}
.mini .btn{width:100%;margin-top:10px;background:#25252D;color:#fff}
.glbig .alldone{text-align:center}
.glbig .alldone .ok{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--sage);color:#26301A;margin-bottom:10px}
.glbig .alldone b{display:block;font:400 26px/1.15 var(--f-serif);color:#1F1F24}
.glbig .alldone span{font:400 13.5px var(--f-ui);color:#6B6B72}

/* Petits widgets */
.widgets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.wdg{position:relative;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto 1fr auto;gap:0 8px;min-height:118px;padding:12px 12px 12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left;color:inherit}
.wdg .wi{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1px solid var(--line-2);color:var(--ink-2)}
.wdg .wi svg.i{width:15px;height:15px}
.wdg .wd{justify-self:end;font:500 11.5px var(--f-ui);color:var(--ink-3)}
.wdg .wv{grid-column:1 / -1;grid-row:3;align-self:end;min-width:0;white-space:nowrap;font:300 26px/1 var(--f-ui);letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums}
.wdg .wv small{font-size:14px;font-weight:400;color:var(--ink-2)}

/* Suivi : cartes pastel bleu et rose avec barres */
.trk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.trc{position:relative;display:flex;flex-direction:column;min-height:236px;padding:16px 14px 14px;border-radius:var(--r);background:var(--blue-c);color:var(--navy-b);overflow:hidden}

.trc .bars i.z{opacity:.18}
.trc .bars i em{position:absolute;left:50%;bottom:calc(100% + 5px);transform:translateX(-50%);font:500 10.5px/1 var(--f-ui);font-style:normal;color:var(--ink);white-space:nowrap}
.trc .foot{margin-top:6px;font:500 10.5px var(--f-ui);color:var(--ink-2)}

/* Grille de cases : 12 semaines, un jour par case */

.hgrid{display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:4px}
.hgrid i{display:grid;place-items:center;aspect-ratio:1;border-radius:4px;background:var(--cream);font:500 10px/1 var(--f-ui);font-style:normal;color:#B09A79;font-variant-numeric:tabular-nums}
.hgrid i.c1{background:#F7C4EA;color:#8A3C74}
.hgrid i.c2{background:var(--orange);color:#fff}
.hgrid i.f{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2);color:transparent}
.hgrid i.now{box-shadow:0 0 0 2px var(--ink)}
.heat h3{margin:18px 2px 6px;font:500 22px/1.2 var(--f-ui);letter-spacing:-.025em;color:var(--ink)}
.heat p{margin:0 2px;font-size:14px;color:var(--ink-2)}
.hleg{display:flex;gap:14px;margin:12px 2px 0;font:500 12px var(--f-ui);color:var(--ink-2)}
.hleg span{display:inline-flex;align-items:center;gap:6px}
.hleg i{width:11px;height:11px;border-radius:3px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .hgrid i{background:#2A2620;color:#8A7C66} :root:not([data-theme="light"]) .hgrid i.c1{background:#5A2D4E;color:#F6C9EA} }

/* Carte sombre olive : pilules par routine */
.olive{padding:22px 18px 16px;border-radius:var(--r);background:var(--olive);color:#EFE7DA;text-align:center;overflow:hidden}
.olive .ok{font:500 13px var(--f-ui);color:#CFC3AE}
.olive h3{margin:8px auto 20px;max-width:22ch;font:400 24px/1.2 var(--f-ui);letter-spacing:-.025em;color:#F6EFE3}
.pills{display:grid;gap:14px;text-align:left}
.pl-l{display:flex;justify-content:space-between;margin:0 2px 6px;font:500 12.5px var(--f-ui);color:#DCD1BF}
.pl-w{position:relative;padding-right:52px}
div.pl{position:relative;height:22px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--c)}
div.pl i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:var(--c);min-width:16px}
.pl-w::after{content:"";position:absolute;right:40px;top:50%;width:10px;height:1.5px;background:var(--c)}
.pl-w em{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:6px;font:500 12.5px/1 var(--f-ui);font-style:normal;color:#F6EFE3}
.pl-w em::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.bits{display:flex;justify-content:center;gap:6px;margin:22px -18px -16px;padding:10px 0 12px;background:rgba(0,0,0,.14)}
.bits i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;font:600 11px/1 var(--f-ui);font-style:normal;background:#F6EFE3;color:#6A5A43}
.bits i.c1{background:#F7C4EA;color:#8A3C74}
.bits i.c2{background:var(--orange);color:#fff}
.bits i.f{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);color:rgba(255,255,255,.5)}

/* Cartes de routine (photo, verre) */
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){ .rgrid{grid-template-columns:repeat(4,minmax(0,1fr))} }
.rc{position:relative;isolation:isolate;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;background:color-mix(in srgb,var(--c) 50%,#222);color:#fff;transition:transform .18s var(--ease)}
.rc:active{transform:scale(.98)}
.rc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;z-index:-2}
.rc::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 26%,transparent) 0%,transparent 34%,color-mix(in srgb,var(--c) 34%,transparent) 70%,color-mix(in srgb,var(--c) 58%,rgba(10,10,20,.2)) 100%)}
.rc-tags{position:absolute;left:10px;top:10px;right:52px;display:flex;flex-wrap:wrap;gap:4px}
.gtag{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:8px;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5);color:#fff;font:500 11.5px/1 var(--f-ui);white-space:nowrap}
.gtag svg.i{width:12px;height:12px;stroke-width:2}
.gtag.ok{background:rgba(181,201,143,.92);border-color:rgba(255,255,255,.4);color:#26301A}
.rc-go{position:absolute;right:10px;top:10px;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.28)!important;border:1px solid rgba(255,255,255,.45)!important;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff!important}
.rc-go svg.i{width:15px;height:15px}
.rc-go svg.pl{fill:currentColor;stroke:none;margin-left:2px;width:13px;height:13px}
.rc-b{position:absolute;left:8px;right:8px;bottom:8px;padding:11px 12px 10px;border-radius:10px}
.rc-b .tw{min-height:calc(2 * 1.14 * 18px);display:flex;align-items:flex-end}
.rc-t{font:500 18px/1.14 var(--f-ui);letter-spacing:-.02em;color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc-s{margin-top:5px;font:500 12px/1.3 var(--f-ui);color:rgba(255,255,255,.82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.smoke{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.34);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 24px -14px rgba(0,0,0,.35)}
@media (max-width:699px){ .rgrid .rc:last-child:nth-child(odd){grid-column:1/-1;aspect-ratio:16/10} .rgrid .rc:last-child:nth-child(odd) img{object-position:50% 22%} .rgrid .rc:last-child:nth-child(odd) .rc-b{right:auto;width:62%} }

/* Carte programme (photo floutée, badge calendrier) */
.lotus{position:relative;isolation:isolate;overflow:hidden;border-radius:var(--r-lg);background:#0B0C10;color:#fff;min-height:330px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px}
.lotus .bgimg{position:absolute;inset:-30px;z-index:-2;width:calc(100% + 60px);height:70%;object-fit:cover;filter:blur(22px) saturate(1.4) brightness(1.05)}
.lotus .bgimg.brand{inset:0;width:100%;height:78%;object-position:70% 20%;filter:none}
.lotus:has(.bgimg.brand)::before{display:none}
.lotus::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(55% 45% at 18% 8%,rgba(170,150,255,.7),transparent 70%),radial-gradient(50% 42% at 88% 12%,rgba(143,180,232,.7),transparent 70%),radial-gradient(60% 40% at 55% 38%,rgba(243,160,220,.45),transparent 72%);mix-blend-mode:screen}
.lotus::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(11,12,16,0) 0%,rgba(11,12,16,.15) 28%,rgba(11,12,16,.9) 60%,#0B0C10 100%)}
.cal{position:absolute;left:16px;top:16px;display:flex;flex-direction:column;align-items:center;width:52px;border-radius:8px;overflow:hidden;background:#fff;color:#1F1F24;box-shadow:0 6px 18px -8px rgba(0,0,0,.4)}
.cal .m{align-self:stretch;text-align:center;padding:4px 0 3px;background:#1F1F24;color:#fff;font:700 9.5px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase}
.cal b{font:600 19px/1 var(--f-ui);letter-spacing:-.02em;margin-top:5px;color:#1F1F24}
.cal .d{font:500 10px/1 var(--f-ui);color:#6B6B72;margin:3px 0 6px}
.lotus .act{position:absolute;right:16px;top:16px;width:44px;height:44px;border-radius:10px}
.lotus h3{font:300 34px/1.05 var(--f-serif);letter-spacing:-.015em;margin:0 0 8px;color:#fff;text-wrap:balance}
.lotus p{margin:0 0 16px;font-size:14px;line-height:1.45;color:rgba(255,255,255,.62);max-width:34ch}
.lotus .bar{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:0 0 16px}
.lotus .bar i{height:5px;border-radius:3px;background:rgba(255,255,255,.16)}
.lotus .bar i.done{background:var(--indigo-2)}
.lotus .bar i.now{background:#fff}
.wbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:12px;border:0;background:#fff;color:#1F1F24;font:600 15px var(--f-ui);transition:transform .15s var(--ease)}
.wbtn:active{transform:scale(.98)}
.wbtn svg.i{width:18px;height:18px}

/* Tuiles pastel */
.ptiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.ptile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:26px;min-height:156px;padding:14px 16px 16px;border-radius:var(--r);border:0;background:var(--bgc,var(--p-lime));color:#1F1F24;text-align:left;transition:transform .15s var(--ease)}
button.ptile:active{transform:scale(.98)}
.ptile .it{display:grid;place-items:center;width:38px;height:38px;border-radius:8px;background:rgba(255,255,255,.95);color:#1F1F24;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.ptile .it svg.i{width:19px;height:19px}
.ptile b{display:flex;align-items:flex-end;min-height:calc(2 * 1.25em);font:500 15.5px/1.25 var(--f-ui);letter-spacing:-.01em;color:inherit}
.ptile span.s{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:calc(2 * 1.4em);margin-top:4px;font:400 13px/1.4 var(--f-ui);color:color-mix(in srgb,currentColor 76%,transparent)}
.ptile.dark{background:#141418;color:#fff}
.ptile.dark .it{background:#fff}
.ptile.white{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink)}

@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .ptile:not(.dark):not(.white){color:var(--ink)} :root:not([data-theme="light"]) .ptile:not(.dark) .it{background:rgba(255,255,255,.1);color:var(--ink)} }

/* Texte en deux tons, accroche éditoriale */
.twotone{font:400 26px/1.18 var(--f-ui);letter-spacing:-.03em;color:var(--ink);margin:10px 0 18px;text-wrap:balance}

.twotone.big{font-size:30px}
.twotone.quote{margin:40px 0 34px;padding-right:8%}
.edito{font:300 36px/1.12 var(--f-serif);letter-spacing:-.015em;color:#3A3A40;margin:14px 0 14px;text-wrap:balance}
.edito span{color:var(--ink-3)}
.edito + .lede{font-size:15.5px;line-height:1.55;color:var(--ink-2);max-width:44ch;margin:0 0 22px}
@media (min-width:700px){ .twotone{font-size:34px} .twotone.big{font-size:40px} .edito{font-size:46px} }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .edito{color:var(--ink)} }

/* Easter egg : le chat se fait défroisser */
.catov{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;background:rgba(242,241,238,.6);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);opacity:0;transition:opacity .3s var(--ease);cursor:pointer}
.catov.on{opacity:1}
.catov svg{width:min(66vw,270px);height:auto;overflow:visible;opacity:0;transform:scale(.55) translateY(30px);transition:transform .7s cubic-bezier(.34,1.56,.64,1),opacity .25s}
.catov.on svg{opacity:1;transform:none}
.catov .roll{transform-box:view-box;transform-origin:150px 130px}
.catov.go .roll{animation:kroll 1.8s .45s cubic-bezier(.45,0,.35,1) both}
@keyframes kroll{0%{transform:none}20%{transform:translate(-30px,-34px) rotate(-6deg)}42%{transform:translate(-60px,2px) rotate(4deg)}62%{transform:translate(-94px,-28px) rotate(-8deg)}82%{transform:translate(-42px,8px) rotate(3deg)}100%{transform:none}}
.catov .wr{transition:opacity .4s var(--ease)}
.catov.go .wr{opacity:0;transition-delay:var(--d)}
.catov .dull{transition:opacity .9s 1.1s}
.catov.go .dull{opacity:0}
.catov .wink{transition:opacity .12s 2.1s}
.catov.go .wink{opacity:0}
.catov .eyeL{opacity:0;transform:scaleY(.12);transform-box:fill-box;transform-origin:center;transition:opacity .12s 2.12s,transform .35s 2.12s cubic-bezier(.34,1.56,.64,1)}
.catov.go .eyeL{opacity:1;transform:none}
.catov .glowL,.catov .blushL{opacity:0;transition:opacity .7s 1.7s}
.catov.go .glowL,.catov.go .blushL{opacity:1}
.catov .spk2{opacity:0;transform-box:fill-box;transform-origin:center}
.catov.go .spk2{animation:kspk .8s var(--d) both}
@keyframes kspk{0%{opacity:0;transform:scale(0) rotate(-40deg)}60%{opacity:1;transform:scale(1.3) rotate(8deg)}100%{opacity:.95;transform:none}}
.catov .cap{text-align:center;opacity:0;transform:translateY(10px);transition:opacity .45s 2.3s,transform .45s 2.3s var(--ease)}
.catov.go .cap{opacity:1;transform:none}
.catov .cap b{display:block;font:300 40px/1.05 var(--f-serif);letter-spacing:-.015em;color:var(--ink)}
.catov .cap span{display:block;margin-top:8px;font:500 14.5px/1.4 var(--f-ui);color:var(--ink-2)}
@media (prefers-reduced-motion: reduce){ .catov.go .roll,.catov.go .spk2{animation:none} .catov.go .spk2{opacity:.95} }
.catcard{grid-column:1/-1;display:flex;align-items:center;gap:12px;width:100%;padding:12px 12px 12px 10px;border:0;border-radius:var(--r);background:linear-gradient(135deg,#ECE8FB,#F7F5FF);box-shadow:var(--shadow),inset 0 0 0 1px rgba(76,70,238,.12);text-align:left;color:#3B3870}
.catcard .ci{flex:none;width:52px;height:48px;background:url(__LOGO__) center/contain no-repeat}

@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .catov{background:rgba(16,16,18,.6)} }

.trc .tempty{flex:1;display:flex;align-items:center;margin:18px 0 0;font:500 13px/1.4 var(--f-ui);color:var(--ink-2)}
.tip{display:flex;gap:14px;align-items:flex-start;margin:6px 0 0;padding:16px;border-radius:var(--r);background:var(--p-lime);color:#1F1F24}
.tip .it{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:8px;background:rgba(255,255,255,.95);color:#1F1F24}
.tip .it svg.i{width:20px;height:20px}
.tip .k{display:block;font:600 12px/1 var(--f-ui);letter-spacing:.02em;color:#4E5A2A;margin:2px 0 6px}
.tip b{display:block;font:500 16px/1.3 var(--f-ui);color:#1F1F24}
.tip p{margin:4px 0 0;font:400 14px/1.45 var(--f-ui);color:#3A3F2C}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tip{color:var(--ink)} :root:not([data-theme="light"]) .tip .it{background:rgba(255,255,255,.1);color:var(--ink)} :root:not([data-theme="light"]) .tip b{color:var(--ink)} :root:not([data-theme="light"]) .tip p,:root:not([data-theme="light"]) .tip .k{color:var(--ink-2)} }

/* Accueil au premier lancement */

.onb-opt[aria-checked="true"] .r{box-shadow:inset 0 0 0 7px var(--indigo)}
.onb-opt .tx b{display:block;font:500 16px/1.25 var(--f-ui);color:var(--ink)}
.onb-opt .tx span{display:block;font-size:14px;color:var(--ink-2);margin-top:2px}
.onb-date{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:12px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);font:500 15px var(--f-ui);color:var(--ink)}
.onb-date input{font:500 16px var(--f-ui);border:0;background:var(--card-3);border-radius:8px;padding:8px 10px;color:var(--ink)}
.onb-note{display:flex;gap:10px;align-items:flex-start;margin:16px 0 0;font-size:14px;line-height:1.5;color:var(--ink-2)}
.onb-note svg.i{flex:none;width:18px;height:18px;margin-top:2px;color:var(--ink-3)}
/* Objectifs */
.goalgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
@media (min-width:560px){ .goalgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }
.goalc{position:relative;display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 34px 10px 12px;border-radius:10px;border:1.5px solid var(--line-2);background:var(--card);text-align:left;color:var(--ink);font:500 14.5px/1.25 var(--f-ui)}
.goalc svg.i{flex:none;width:20px;height:20px;color:var(--indigo)}
.goalc svg.i:last-child{position:absolute;right:10px;top:50%;width:16px;height:16px;margin-top:-8px;opacity:0;color:#fff}
.goalc[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:#fff}
.goalc[aria-pressed="true"] svg.i{color:#fff}
.goalc[aria-pressed="true"] svg.i:last-child{opacity:1}
/* Choix segmentés */
.seg{display:flex;gap:4px;padding:4px;border-radius:10px;background:var(--card-3)}
.seg button{flex:1;min-width:44px;min-height:44px;padding:0 8px;border:0;border-radius:8px;background:none;font:500 14.5px var(--f-ui);color:var(--ink-2)}
.seg button[aria-checked="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg.big button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:76px;font-size:13.5px}
.seg.big button span{font-weight:500;line-height:1;color:var(--ink)}
/* Bilan de la semaine */
.bilan .box-h{flex-wrap:wrap}
.bil-w{margin-left:auto;font:500 13px var(--f-ui);color:var(--ink-3)}
.bil-row{display:grid;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.bil-l b{display:block;font:500 15px/1.3 var(--f-ui);color:var(--ink)}
.bil-l span{display:block;font-size:13.5px;color:var(--ink-3);margin-top:1px}
.rng{display:flex;align-items:center;gap:12px}
.rng input{flex:1;height:44px;accent-color:var(--indigo)}
.rng output{min-width:28px;text-align:right;font:500 18px var(--f-ui);color:var(--ink);font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);background:var(--card);color:var(--ink)}
.stepper output{min-width:40px;text-align:center;font:500 20px var(--f-ui);color:var(--ink);font-variant-numeric:tabular-nums}
.bil-hist{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px}
.spk{display:grid;grid-template-columns:1fr auto;align-items:end;gap:2px 8px;padding:10px 12px;border-radius:10px;background:var(--card-2)}
.spk span{grid-column:1/-1;font:500 12.5px var(--f-ui);color:var(--ink-3)}
.spk svg{width:100%;height:40px;overflow:visible}
.spk polyline{fill:none;stroke:var(--indigo);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spk circle{fill:var(--indigo)}
.spk b{font:500 18px var(--f-ui);color:var(--ink)}
.spk b small{font-size:12px;color:var(--ink-3)}
.nudge{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:12px 14px;border:0;border-radius:12px;background:var(--indigo-soft);text-align:left;color:var(--ink)}
.nudge .ic{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:8px;background:var(--card);color:var(--indigo)}
.nudge .tx{flex:1;min-width:0}
.nudge b{display:block;font:500 15px/1.3 var(--f-ui)}
.nudge .tx span{display:block;font-size:13.5px;color:var(--ink-2)}
/* Réglages */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;font:500 15px var(--f-ui);color:var(--ink)}
.setrow input{font:500 16px var(--f-ui)}
#setBody .list .li{width:100%;border:0;background:none;text-align:left;color:inherit}
#setBody .list .li svg.i{color:var(--ink-3)}
#setBody textarea{display:block;width:100%;margin:12px 0 8px;padding:12px;border-radius:8px;border:1px solid var(--line-2);background:var(--card-2);font:400 13px/1.4 ui-monospace,Menlo,monospace;color:var(--ink);resize:vertical}
#setBody .prose{margin:0 0 12px;font-size:15px;color:var(--ink-2)}
#setBody .btn svg.i{width:16px;height:16px}
.restore{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.restore summary{display:flex;align-items:center;justify-content:space-between;min-height:44px;font:500 15px var(--f-ui);color:var(--ink);cursor:pointer;list-style:none}
.restore summary::-webkit-details-marker{display:none}
.restore summary svg.i{width:18px;height:18px;color:var(--ink-3);transition:transform .2s}
.restore[open] summary svg.i{transform:rotate(180deg)}
/* Lecteur : matériel */
.prep{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 14px}
.prep .k{font:600 12.5px var(--f-ui);color:var(--ink-3);margin-right:2px}
.prep span:not(.k){display:inline-flex;align-items:center;height:30px;padding:0 11px;border-radius:8px;background:var(--card);border:1px solid var(--line-2);font:500 13px var(--f-ui);color:var(--ink)}

/* Matières de la marque : champs de verre dépoli, trame de points, pièces de verre */
.field{position:absolute;inset:0;z-index:-1;background:center/cover no-repeat}
.field.f-lav{background-image:url(media/brand/field-agenda.webp)}
.field.f-jade{background-image:url(media/brand/field-jade.webp)}
.field.f-blush{background-image:url(media/brand/field-blush.webp)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .field{filter:brightness(.82) saturate(1.05)} }
.tip{position:relative;overflow:hidden}
.trc .bars{background-image:repeating-linear-gradient(to top,color-mix(in srgb,currentColor 14%,transparent) 0 1px,transparent 1px 25%)}
.onb-hero{position:relative;isolation:isolate;overflow:hidden;display:grid;place-items:center;height:210px;margin:8px 0 22px;border-radius:16px}
.onb-hero .tile{display:grid;place-items:center;width:146px;height:146px;border-radius:18px;background:rgba(255,255,255,.34);border:1px solid rgba(255,255,255,.7);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 18px 40px -20px rgba(43,22,48,.45)}
.onb-hero .onb-logo{margin:0;width:104px;height:96px}

/* Tuiles d'Apprendre : cartes sobres, filet fin, cases de preuve */
.ptile{background:var(--card);border:1px solid var(--line);color:var(--ink);box-shadow:none;gap:22px}
.ptile .it,.ptile.white .it,.ptile.dark .it{width:24px;height:24px;background:none;box-shadow:none;color:var(--ink-2)}
.ptile .it svg.i{width:22px;height:22px;stroke-width:1.5}
.ptile span.s{color:var(--ink-2)}
.ptile.white{background:var(--card)}
.ptile.dark{background:#121016 url(media/brand/field-night.webp) 70% 30%/cover no-repeat;border-color:transparent;color:#fff}
.ptile.dark .it{color:rgba(255,255,255,.8)}
.ptile.dark span.s{color:rgba(255,255,255,.72)}
.evb{display:block;margin-top:14px}
.evb-g{display:flex;flex-wrap:wrap;gap:3px;max-width:136px}
.ptile.lead .evb-g{max-width:none}
.evb-g i{width:10px;height:10px;border-radius:2px;background:var(--seg)}
.evb-g i.p4{background:var(--indigo)}
.evb-g i.p3{background:var(--indigo-2)}
.evb-g i.p2{background:#C3B6FF}
.evb-l{display:block;margin-top:8px;font:500 12px/1.35 var(--f-ui);color:var(--ink-3)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .evb-g i.p2{background:#5B5690} }
/* Conseil du jour : carte éditoriale */
.tip{background:var(--card);border:1px solid var(--line);padding:16px 16px 16px 20px;color:var(--ink)}
.tip::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:0 2px 2px 0;background:var(--indigo)}
.tip .it{width:36px;height:36px;border-radius:8px;background:var(--card-3);color:var(--ink-2)}
.tip .k{color:var(--ink-3);letter-spacing:0}
.tip b{font:400 20px/1.25 var(--f-serif);letter-spacing:-.01em;color:var(--ink)}
.tip p{color:var(--ink-2)}
.nudge{background:var(--card);border:1px solid var(--line)}
.nudge .ic{background:var(--indigo-soft)}

/* Photos */
.phnext{display:grid;gap:18px}
.phnext-t{display:grid;gap:4px}
.phnext-t b{font:500 18px/1.25 var(--f-ui);letter-spacing:-.02em;color:var(--ink)}
.phnext-t span{font-size:14.5px;line-height:1.45;color:var(--ink-2)}
.phsteps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);position:relative}
.phsteps::before{content:"";position:absolute;left:12.5%;right:12.5%;top:6px;height:1px;background:var(--line-2)}
.phsteps li{position:relative;display:grid;justify-items:center;gap:3px;text-align:center}
.phsteps i{width:13px;height:13px;border-radius:50%;background:var(--card);border:1.5px solid var(--ink-4);margin-bottom:6px;position:relative;z-index:1}
.phsteps li.done i{background:var(--ink);border-color:var(--ink)}
.phsteps li.next i{border-color:var(--indigo);box-shadow:0 0 0 4px var(--indigo-soft)}
.phsteps b{font:500 12.5px/1.2 var(--f-ui);color:var(--ink)}
.phsteps span{font-size:11.5px;color:var(--ink-3)}
.phsteps li:not(.done):not(.next) b{color:var(--ink-3)}
.phwait{display:grid;gap:4px;margin-top:10px}
.phwait b{font:500 15.5px/1.3 var(--f-ui)}
.phwait span{font-size:14px;line-height:1.45;color:var(--ink-2)}
.phcmp{display:grid;gap:14px}
.phsel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.phsel label{display:grid;gap:5px}
.phsel span{font-size:13px;color:var(--ink-3)}
.phsel select{height:44px;padding:0 10px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--card-2);color:var(--ink);font:500 14px var(--f-ui);min-width:0}
.phcmp .seg{display:flex;width:100%}
.phcmp .seg button{flex:1}
.phstage{position:relative;aspect-ratio:3/4;border-radius:var(--r-sm);overflow:hidden;background:var(--card-3);--x:50%}
.phstage figure{position:absolute;inset:0;margin:0}
.phstage img{width:100%;height:100%;object-fit:cover;display:block}
.phstage figcaption{position:absolute;bottom:10px;padding:5px 8px;border-radius:6px;background:rgba(20,20,26,.62);color:#fff;font:500 12px/1 var(--f-ui);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.phstage .pa figcaption{left:10px}
.phstage .pb figcaption{right:10px}
.phstage.m-slider .pb{clip-path:inset(0 0 0 var(--x))}
.ph-handle{position:absolute;top:0;bottom:0;left:var(--x);width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.15);pointer-events:none}
.ph-handle::after{content:"";position:absolute;top:50%;left:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25);background-image:linear-gradient(90deg,transparent 11px,#25252D 11px,#25252D 13px,transparent 13px,transparent 21px,#25252D 21px,#25252D 23px,transparent 23px)}
.ph-range{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize;touch-action:pan-y}
.phstage:has(.ph-range:focus-visible){outline:2px solid var(--indigo);outline-offset:2px}
.phstage.m-side{aspect-ratio:3/2;display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--line-2)}
.phstage.m-side figure{position:relative}
.phstage.m-side .pa figcaption,.phstage.m-side .pb figcaption{left:8px;right:auto;bottom:8px}
.phstage.m-fade .pb{animation:phfade 4.2s ease-in-out infinite alternate}
@keyframes phfade{0%,22%{opacity:0}78%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){.phstage.m-fade .pb{animation:none;opacity:.5}}
.phacts{display:flex;flex-wrap:wrap;gap:8px}
.phacts .btn{flex:1 1 auto}
.phalert{margin:0 0 12px;padding:12px 14px;border-radius:var(--r-sm);background:var(--pink-c);color:var(--maroon);font-size:14px}
.ana{display:grid;gap:12px;padding-top:16px;border-top:1px solid var(--line)}
.ana-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ana-h b{font:500 16px/1.2 var(--f-ui)}
.conf{padding:4px 8px;border-radius:6px;font:500 12px/1 var(--f-ui);background:var(--card-3);color:var(--ink-2)}
.conf.c-bonne{background:color-mix(in srgb,var(--green) 14%,var(--card));color:var(--green)}
.conf.c-faible{background:color-mix(in srgb,var(--amber) 14%,var(--card));color:var(--amber)}
.ana-s{margin:0;font:400 18px/1.4 var(--f-serif);color:var(--ink)}
.ana-s.thinking{color:var(--ink-3);animation:phpulse 1.6s ease-in-out infinite}
@keyframes phpulse{50%{opacity:.45}}
.ana-c{display:flex;gap:8px;align-items:flex-start;margin:0;font-size:13.5px;line-height:1.45;color:var(--ink-2)}
.ana-c svg.i{width:16px;height:16px;flex:none;margin-top:1px;color:var(--ink-3)}
.ana-c.warn svg.i{color:var(--amber)}
.ana-z{list-style:none;margin:0;padding:0;display:grid}
.ana-z li{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.ana-z li div{display:grid;gap:3px}
.ana-z b{font:500 14.5px/1.3 var(--f-ui)}
.ana-z span{font-size:13px;line-height:1.4;color:var(--ink-3)}
.vd{flex:none;padding:5px 8px;border-radius:6px;font:500 12px/1 var(--f-ui);font-style:normal;white-space:nowrap}
.vd.v-up{background:color-mix(in srgb,var(--green) 14%,var(--card));color:var(--green)}
.vd.v-eq{background:var(--card-3);color:var(--ink-2)}
.vd.v-down{background:color-mix(in srgb,var(--rose) 14%,var(--card));color:var(--rose)}
.vd.v-na{background:none;border:1px dashed var(--ink-4);color:var(--ink-3)}
.ana .note{margin:0}
.phlist .phrow{gap:12px}
.phrow .tx{flex:1;min-width:0;display:grid;gap:2px}
.phrow .tx b{font:500 15px/1.25 var(--f-ui)}
.phrow .tx span{font-size:13px;color:var(--ink-3)}
.phthumbs{display:flex;gap:4px}
.phthumbs img{width:34px;height:45px;object-fit:cover;border-radius:4px;background:var(--card-3)}
.phthumbs img.missing{visibility:hidden}
.icon-btn.sm{width:36px;height:36px;box-shadow:none}
.icon-btn.sm svg.i{width:16px;height:16px}
.btn.danger{background:var(--rose);color:#fff}
.phcam b,.phreel b{color:#fff}
.phcmp .seg button{padding:0 6px;white-space:nowrap;font-size:13.5px}
.phsteps li.miss i{border-style:dashed}
.phsteps li.miss b{text-decoration:line-through;text-decoration-color:var(--ink-4)}
/* Prise de vue */
.phcam,.phreel{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(env(safe-area-inset-top) + 64px) 16px calc(env(safe-area-inset-bottom) + 18px);background:#0E0E11;color:#fff}
.phcam[hidden],.phreel[hidden]{display:none}
.camframe{position:relative;width:min(100%,calc((100dvh - 260px) * .75));aspect-ratio:3/4;border-radius:var(--r-sm);overflow:hidden;background:#1A1A1F;flex:none}
.camframe video,.camframe img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.camframe video{transform:scaleX(-1)}
.camg{opacity:.35;transform:scaleX(-1);pointer-events:none}
.camguide{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:rgba(255,255,255,.55);stroke-width:1;stroke-dasharray:4 5;pointer-events:none}
.camguide line{stroke:rgba(255,255,255,.22)}
.camtop{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.camtitle{display:grid;justify-items:center;gap:2px}
.camtitle b{font:500 16px/1.2 var(--f-ui)}
.camtitle span{font-size:12.5px;color:rgba(255,255,255,.6)}
.camtip{max-width:420px;text-align:center;font-size:14px;line-height:1.45;color:rgba(255,255,255,.78)}
.camcount{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font:300 96px/1 var(--f-ui);color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.4);pointer-events:none;z-index:3}
.cambot{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px 14px;max-width:440px}
.cambot .btn{min-width:130px}
.cambot .btn.sec{background:rgba(255,255,255,.12);color:#fff}
.cambot .btn:not(.sec){background:#fff;color:#1F1F24}
.camshutter{width:74px;height:74px;border-radius:50%;border:3px solid #fff;background:none;padding:5px}
.camshutter i{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform .12s var(--ease)}
.camshutter:active i{transform:scale(.9)}
.camchip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;font:500 13px var(--f-ui)}
.camchip svg.i{width:15px;height:15px}
.camchip[aria-pressed="false"]{color:rgba(255,255,255,.55)}
.camskip{flex-basis:100%;text-align:center;color:rgba(255,255,255,.6)!important}
.camnolive{flex-basis:100%;margin:0;text-align:center;font-size:14px;line-height:1.5;color:rgba(255,255,255,.75)}
.phcam .icon-btn.glass,.phreel .icon-btn.glass{background:rgba(255,255,255,.12)!important;border-color:rgba(255,255,255,.18)!important}
/* Montage */
.rl-top{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.rl-v{text-align:center;font:500 15px var(--f-ui);color:rgba(255,255,255,.8)}
.rl-stage{position:relative;width:min(100%,calc((100dvh - 280px) * .75));aspect-ratio:3/4;border-radius:var(--r-sm);overflow:hidden;background:#1A1A1F;flex:none}
.rl-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s ease}
.rl-stage img.on{opacity:1}
.rl-cap{display:grid;justify-items:center;gap:3px}
.rl-cap b{font:400 24px/1.1 var(--f-serif)}
.rl-cap span{font-size:13px;color:rgba(255,255,255,.6)}
.rl-bar{display:flex;gap:4px;width:min(100%,280px)}
.rl-bar i{flex:1;height:2px;border-radius:1px;background:rgba(255,255,255,.2);transition:background .4s}
.rl-bar i.on{background:#fff}
.rl-acts .btn.sec{background:rgba(255,255,255,.12);color:#fff}
.rl-img{position:fixed;inset:0;z-index:90;display:grid;place-items:center;align-content:center;gap:14px;padding:24px;background:#0E0E11}
.rl-img img{max-width:100%;max-height:75dvh;border-radius:var(--r-sm)}
.rl-img p{margin:0;text-align:center;font-size:14px;color:rgba(255,255,255,.75)}

/* Barre d'onglets : icônes, onglet actif dans un rond sombre */
.tabbar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);transform:translateX(-50%);z-index:30;display:flex;align-items:center;justify-content:space-between;gap:4px;width:min(calc(100% - 32px),380px);padding:8px;border-radius:999px;background:rgba(255,255,255,.72);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);box-shadow:0 18px 40px -18px rgba(30,30,50,.35),inset 0 1px 0 rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.9)}
.tab{position:relative;display:grid;place-items:center;flex:1 1 0;max-width:56px;aspect-ratio:1;border:0;border-radius:50%;background:none;color:#3A3A42;transition:background .25s var(--ease),color .25s var(--ease),transform .15s var(--ease)}
.tab:active{transform:scale(.94)}
.tab svg.i{width:23px;height:23px;stroke-width:1.5}
.tab span{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tab[aria-selected="true"]{background:#25252D;color:#fff;box-shadow:0 8px 18px -8px rgba(20,20,30,.6)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tabbar{background:rgba(30,30,36,.72);border-color:rgba(255,255,255,.08)} :root:not([data-theme="light"]) .tab{color:#C9C9D0} :root:not([data-theme="light"]) .tab[aria-selected="true"]{background:#fff;color:#1F1F24} }

/* Listes, boîtes */
.list{border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.li{position:relative;display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:64px}
.li + .li::before{content:"";position:absolute;top:0;left:68px;right:0;height:1px;background:var(--line)}
.li.plain + .li.plain::before{left:16px}
.li .ic{display:grid;place-items:center;width:38px;height:38px;border-radius:8px;flex:none;background:color-mix(in srgb,var(--c,var(--indigo)) 13%,var(--card));color:var(--c,var(--indigo))}
.li .ic svg.i{width:19px;height:19px}
.li .tx{flex:1;min-width:0}
.li b{display:block;font:500 15px/1.3 var(--f-ui);color:var(--ink)}
.li .tx > span{display:block;font-size:13.5px;line-height:1.45;color:var(--ink-2);margin-top:2px}
.li .wk-min{flex:none;align-self:flex-start;margin-top:1px;font:500 13px var(--f-ui);color:var(--ink-3);font-variant-numeric:tabular-nums}
.chipset{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rchip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:8px;font:500 12px/1 var(--f-ui);background:color-mix(in srgb,var(--c) 13%,var(--card));color:color-mix(in srgb,var(--c) 70%,var(--mixk))}
.rchip svg.i{width:13px;height:13px;stroke-width:2}
.box{border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);padding:18px}
.box-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.box-h .ic{display:grid;place-items:center;width:38px;height:38px;border-radius:8px;background:color-mix(in srgb,var(--c,var(--indigo)) 13%,var(--card));color:var(--c,var(--indigo))}
.box-h b{font:500 16px/1.25 var(--f-ui)}
.duo{display:grid;gap:10px}
@media (min-width:700px){ .duo{grid-template-columns:1fr 1fr} }
.ticks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ticks li{position:relative;padding-left:28px;font-size:14.5px;line-height:1.45}
.ticks li::before{content:"";position:absolute;left:0;top:1px;width:19px;height:19px;border-radius:50%;background:color-mix(in srgb,var(--c,var(--green)) 15%,var(--card))}
.ticks li::after{content:"";position:absolute;left:6px;top:6px;width:7px;height:4px;border-left:2px solid var(--c,var(--green));border-bottom:2px solid var(--c,var(--green));transform:rotate(-45deg)}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:12px;border:0;background:var(--dark);color:var(--card);font:500 14.5px/1 var(--f-ui);white-space:nowrap;transition:transform .15s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--card-3);color:var(--ink)}
.btn.sm{height:38px;padding:0 15px;font-size:13.5px}
.btn svg.i{width:17px;height:17px}
.btn svg.pl{fill:currentColor;stroke:none;width:14px;height:14px}
.btn-full{display:flex;width:100%;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:12px;border:0;background:var(--dark);color:var(--card);font:500 15.5px/1 var(--f-ui);transition:transform .15s var(--ease)}
.btn-full:active{transform:scale(.98)}
.btn-full[aria-pressed="true"]{background:var(--card-3);color:var(--ink)}
.btn-full svg.i{width:19px;height:19px}
.btn-full[aria-pressed="true"] svg.i{fill:currentColor}

/* Gestes : recherche, filtres, grille */
.searchbar{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink-3);cursor:text}
.searchbar input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;font:400 15.5px var(--f-ui);color:var(--ink)}
.searchbar input::placeholder{color:var(--ink-3)}
.searchbar input::-webkit-search-cancel-button{-webkit-appearance:none}
.searchbar .sclear{display:grid;place-items:center;width:28px;height:28px;margin-right:-6px;border:0;border-radius:50%;background:var(--card-3);color:var(--ink-2)}
.searchbar .sclear svg.i{width:14px;height:14px;stroke-width:2.2}
.filters{position:relative}
.chips{display:flex;gap:6px;margin:14px calc(var(--pad) * -1) 16px;padding:2px var(--pad) 8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px 0 11px;border-radius:8px;border:1px solid var(--line-2);background:transparent;color:var(--ink);font:500 13.5px/1 var(--f-ui);transition:background .2s var(--ease),color .2s var(--ease)}
.chip svg.i{width:16px;height:16px;color:var(--c,var(--ink-2))}
.chip .n{font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--dark);border-color:var(--dark);color:var(--card)}
.chip[aria-pressed="true"] svg.i{color:var(--card)}
.chip[aria-pressed="true"] .n{color:color-mix(in srgb,var(--card) 60%,transparent)}
.chip.noic{padding-left:15px}
.pop{position:absolute;left:0;right:0;top:calc(100% - 10px);z-index:15;padding:18px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-lg);animation:fade .25s var(--ease)}
.pop h3{margin:0 0 10px;font:500 14.5px var(--f-ui);color:var(--ink)}
.pop h3 + .opts{margin-bottom:16px}
.pop .opts{display:flex;flex-wrap:wrap;gap:6px}
.pop .opt{height:36px;padding:0 13px;border-radius:8px;border:0;background:var(--card-3);color:var(--ink);font:500 13.5px var(--f-ui)}
.pop .opt[aria-pressed="true"]{background:var(--dark);color:var(--card)}
.pop .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.linkbtn{border:0;background:none;padding:8px 0;font:500 14px var(--f-ui);color:var(--ink-3)}
.actives{display:flex;flex-wrap:wrap;gap:6px;margin:-6px 0 14px}
.actives:empty{display:none}
.chipx{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px 0 12px;border-radius:8px;border:0;background:var(--card-3);color:var(--ink);font:500 13px/1 var(--f-ui)}
.chipx svg.i{width:13px;height:13px}
.ggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){ .ggrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px} }
.gc{position:relative;isolation:isolate;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;background:color-mix(in srgb,var(--c) 30%,#2A2C33);color:#fff;transition:transform .18s var(--ease)}
.gc:active{transform:scale(.98)}
.gc .media{position:absolute;inset:0;z-index:-2}
.gc .media img,.gc .media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 28%}
.gc::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.1) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 55%,rgba(12,12,18,.24) 100%)}
.gc .gc-tags{position:absolute;left:10px;top:10px;right:50px;display:flex;flex-wrap:wrap;gap:4px}
.gc .gc-tags .gtag i{width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.gc-b{position:absolute;left:8px;right:8px;bottom:8px;padding:10px 11px 9px;border-radius:10px}
.gc-b .tw{min-height:calc(2 * 1.2 * 14.5px);display:flex;align-items:flex-end}
.gc-t{font:500 14.5px/1.2 var(--f-ui);letter-spacing:-.01em;color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gc-s{display:flex;align-items:center;gap:5px;margin-top:4px;font:500 11.5px/1.25 var(--f-ui);color:rgba(255,255,255,.82);white-space:nowrap;overflow:hidden}
.gc-s svg.i{width:12px;height:12px;stroke-width:2}
.bm{position:absolute;right:8px;top:8px;z-index:3;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;padding:0;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.45);color:#fff;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.bm svg.i{width:16px;height:16px}
.bm[aria-pressed="true"]{background:#fff;color:var(--indigo);border-color:#fff}
.bm[aria-pressed="true"] svg.i{fill:currentColor}
.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:38px 24px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);color:var(--ink-2)}
.empty .ic{display:grid;place-items:center;width:52px;height:52px;border-radius:10px;background:var(--indigo-soft);color:var(--indigo);margin-bottom:6px}
.empty b{font:500 16.5px var(--f-ui)}
.rescount{grid-column:1/-1;margin:-4px 2px 2px;font:500 13.5px var(--f-ui);color:var(--ink-3)}
.rsugg{grid-column:1/-1;display:flex;align-items:center;gap:12px;width:100%;padding:12px 12px 12px 14px;border-radius:var(--r);border:0;background:var(--card);box-shadow:var(--shadow),inset 0 0 0 1px var(--line);text-align:left;color:var(--ink-2)}
.rsugg .ic{display:grid;place-items:center;flex:none;width:42px;height:42px;border-radius:8px;background:var(--c);color:#fff}
.rsugg .tx{flex:1;min-width:0}
.rsugg b{display:block;font:500 15px/1.3 var(--f-ui);color:var(--ink)}
.rsugg .tx span{display:block;font-size:13px;color:var(--ink-3);margin-top:2px}
.rsugg .go{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:50%;background:var(--dark);color:var(--card)}
.rsugg .go svg.i{width:14px;height:14px;fill:currentColor;stroke:none;margin-left:2px}
.sugg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:12px}
.sugg button{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:0;background:var(--card-3);color:var(--ink);font:500 13px var(--f-ui)}
.sugg button svg.i{width:14px;height:14px;color:var(--ink-3)}
.cibs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.cib{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px 0 9px;border-radius:8px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);font:500 12.5px/1 var(--f-ui)}
.cib svg.i{width:15px;height:15px;color:var(--ink-3)}
.gc.noimg,.rc.noimg,.stagebox.noimg{background:radial-gradient(120% 90% at 20% 10%,color-mix(in srgb,var(--c) 30%,#fff),color-mix(in srgb,var(--c) 80%,#1a1a22) 100%)!important}
.gc.noimg::before,.rc.noimg::before,.stagebox.noimg::before{content:"Photo à venir";position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);padding:6px 11px;border-radius:8px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.3);color:#fff;font:500 11.5px/1 var(--f-ui);white-space:nowrap;z-index:0}
.stagebox.noimg::before{content:"Photo et vidéo à venir";font-size:13px}

/* Indicateurs segmentés */
.meter,.proof{display:inline-flex;gap:3px;vertical-align:1px}
.meter i,.proof i{width:12px;height:6px;border-radius:3px;background:var(--seg)}
.meter i.on,.proof i.on{background:var(--indigo)}
.proof i.on:nth-child(4),.meter i.on:nth-child(4){background:var(--sage)}
.pv{display:inline-flex;align-items:center;gap:8px;font:500 13px var(--f-ui);color:var(--ink-2);white-space:nowrap}

/* Fil d'actualités */
.ticker{display:flex;align-items:center;gap:10px;width:100%;margin:22px 0 0;padding:8px 12px 8px 8px;border-radius:12px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);text-align:left;color:var(--ink)}
.ticker .new{flex:none;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:8px;background:var(--dark);color:var(--card);font:600 11.5px/1 var(--f-ui)}
.ticker .new::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sage);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ticker .tt{flex:1;min-width:0;font:500 14px/1.3 var(--f-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker svg.i{width:18px;height:18px;color:var(--ink-3);flex:none}
.nrow{display:flex;gap:10px;margin:0 calc(var(--pad) * -1);padding:2px var(--pad) 10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.nrow::-webkit-scrollbar{display:none}
.ncard{position:relative;flex:0 0 min(80%,300px);scroll-snap-align:start;display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 12px;align-content:start;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);text-align:left;color:var(--ink-2)}
.ncard .cal{position:static;grid-row:1 / span 2;align-self:start;box-shadow:none;border:1px solid var(--line)}
.nlist{display:grid;gap:10px}
@media (min-width:700px){ .nlist{grid-template-columns:1fr 1fr} }
.nlist .ncard{flex:none}
.ntype{display:inline-flex;align-items:center;gap:5px;justify-self:start;height:24px;padding:0 9px 0 7px;border-radius:8px;background:color-mix(in srgb,var(--c) 13%,var(--card));color:color-mix(in srgb,var(--c) 70%,var(--mixk));font:600 11.5px/1 var(--f-ui)}
.ntype svg.i{width:13px;height:13px;stroke-width:2}
.ncard .nt{font:500 15px/1.3 var(--f-ui);color:var(--ink);letter-spacing:-.008em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:calc(3 * 1.3em)}
.ncard .np{grid-column:1/-1;font-size:13.5px;line-height:1.45;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:calc(2 * 1.45em);margin:8px 0 0}
.ncard .nsrc{grid-column:1/-1;font:500 12px var(--f-ui);color:var(--ink-3);margin-top:4px}
.ncard .fresh{position:absolute;top:12px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--indigo);box-shadow:0 0 0 3px var(--indigo-soft)}
.nempty{padding:18px;border-radius:var(--r);border:1px dashed var(--line-2);color:var(--ink-2);font-size:14px}
.nmeta{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ndate{font:500 12.5px var(--f-ui);color:var(--ink-3)}
.ndetail .big-t{font:300 34px/1.1 var(--f-serif);letter-spacing:-.015em;color:var(--ink);margin:14px 0 12px;text-wrap:balance}
.ndetail .lede{font-size:16px;line-height:1.6;color:var(--ink-2)}
.foryou{display:flex;gap:12px;margin:18px 0;padding:16px;border-radius:var(--r);background:var(--blue-c);color:var(--ink)}
.foryou svg.i{margin-top:1px;flex:none;color:var(--indigo)}
.foryou b{display:block;margin-bottom:3px}
.srcbtn{display:inline-flex;align-items:center;gap:8px;height:50px;padding:0 20px;border-radius:12px;background:var(--dark);color:var(--card);font:500 14.5px var(--f-ui);text-decoration:none}
.srcbtn svg.i{width:17px;height:17px}

/* Bannières */
.banner{position:relative;overflow:hidden;isolation:isolate;border-radius:var(--r-lg);margin:6px 0 22px}
.bn-card{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:16px;min-height:150px;padding:22px 20px 20px}
.banner .say{font:300 26px/1.14 var(--f-serif);letter-spacing:-.01em;text-wrap:balance;max-width:20ch;margin:0}
.banner .say span{opacity:.5}
.banner .fine{font:400 13px/1.45 var(--f-ui);opacity:.8;max-width:38ch}
.banner .fine b{color:inherit}
.banner .kick{display:inline-flex;align-items:center;gap:8px;font:500 12.5px/1 var(--f-ui)}
.banner .kick .it{display:grid;place-items:center;width:30px;height:30px;border-radius:6px;background:rgba(255,255,255,.95);color:#1F1F24}
.banner .kick .it svg.i{width:16px;height:16px}
.banner .stats3{display:flex;gap:18px}
.banner .stats3 > div{flex:1;min-width:0}
.banner .stats3 b{display:block;font:300 28px/1 var(--f-ui);letter-spacing:-.03em;color:inherit}
.banner .stats3 span{display:block;font:500 11.5px/1.3 var(--f-ui);opacity:.72;margin-top:4px}
.banner.glow{padding:18px}
.banner.glow .bn-card{border-radius:12px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.8);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);color:#1F1F24;min-height:130px}
.banner.dots{background:var(--lime);color:#1F1F24}
.banner.dark{background:var(--olive);color:#F4EDE2}
.banner.dark .kick .it{background:#F6EFE3;color:var(--olive)}
.banner .pills{margin-top:2px}
.banner .fine:has(.pills){opacity:1;max-width:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .banner.glow .bn-card{background:rgba(30,30,36,.6);color:var(--ink);border-color:rgba(255,255,255,.1)} :root:not([data-theme="light"]) .banner.dots{background:#2C321A;color:var(--ink)} }

/* Programme */
.pcard2 .row1{display:flex;align-items:center;gap:14px}
.pcard2 .row1 .cal{position:static;box-shadow:none;border:1px solid var(--line)}
.pcard2 .row1 > div > b{display:block;font:500 18px/1.25 var(--f-ui)}
.pcard2 .row1 > div > span{display:block;font-size:14px;color:var(--ink-2);margin-top:2px}
.tl-bar{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:18px 0 6px}
.tl-bar i{height:8px;border-radius:4px;background:var(--seg)}
.tl-bar.started i.done{background:var(--indigo)}
.tl-bar.started i.now{background:var(--sage)}
.tl-legend{display:flex;justify-content:space-between;font:500 11.5px var(--f-ui);color:var(--ink-3);margin-bottom:16px}
.progctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.progctl .lbl{font:500 13.5px var(--f-ui);color:var(--ink-2);margin-right:2px}
.datein{height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--card-2);color:var(--ink);font:500 14.5px var(--f-ui)}
.tline{display:grid;gap:10px}
.tl-item .box{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 14px;padding:16px}
.tl-item .ph{grid-row:1 / span 3;display:grid;place-items:center;width:44px;height:44px;border-radius:8px;font:500 18px/1 var(--f-ui);color:#1F1F24}
.tl-item:nth-child(1) .ph{background:var(--blue-c)} .tl-item:nth-child(2) .ph{background:var(--pink-c)} .tl-item:nth-child(3) .ph{background:var(--sagec)}
.tl-item .w{font:500 12.5px/1.2 var(--f-ui);color:var(--ink-3)}
.tl-item .n{font:500 17px/1.3 var(--f-ui);color:var(--ink)}
.tl-item p{margin:2px 0 0;font-size:14px;color:var(--ink-2)}
.tl-item.cur .box{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo),var(--shadow)}
.tl-item.cur .w::after{content:", en cours";color:var(--indigo)}
.stack{display:grid;gap:10px}
@media (min-width:700px){ .stack.two-col{grid-template-columns:1fr 1fr;align-items:start} }

/* Apprendre */
.tgroup{margin-top:22px}
.tgroup > h3{font:500 13px/1 var(--f-ui);color:var(--ink-3);margin:0 0 10px 2px}
.legends{display:grid;gap:18px}
@media (min-width:700px){ .legends{grid-template-columns:1fr 1fr;gap:28px} }
.legends h3{margin:0 0 8px;font:500 15px var(--f-ui);color:var(--ink)}
.legends dl{margin:0}

.sep{stroke:var(--line-2);stroke-width:1.2;fill:none} .ly3{fill:var(--release);fill-opacity:.2} .fib{stroke:var(--release);stroke-opacity:.6;stroke-width:1;fill:none}
.ly4{fill:color-mix(in srgb,var(--card) 70%,transparent)} .lig{stroke:var(--ink);stroke-width:3;fill:none;stroke-linecap:round;opacity:.6} .ly5{fill:var(--p-lilac)} .hatchl{stroke:var(--line-2);stroke-width:2}
.lnum{font:700 13px var(--f-ui);fill:var(--ink-3)} .ltxt{font:500 14px var(--f-ui);fill:var(--ink)} .ltxt2{font:500 12.5px var(--f-ui);fill:var(--ink-3)}

@media (min-width:700px){ .three{grid-template-columns:repeat(3,1fr)} }

.tablewrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
table{border-collapse:collapse;min-width:760px;width:100%;font-size:14px}
th,td{padding:12px 12px 12px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}

/* Fiche et lecteur */
.overlay{position:fixed;inset:0;z-index:50;overflow-y:auto;background:var(--bg);overscroll-behavior:contain}

.d-title{font:400 30px/1.12 var(--f-ui);letter-spacing:-.03em;color:var(--ink);margin:0 0 6px;text-wrap:balance}
